<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronborgs Widget - Nordic Neon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            background: transparent !important;
            color: #f8fafc;
            font-family: 'Inter', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #errbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
            display: none; background: #3a0000; color: #ff9b9b;
            font: 12px/1.4 monospace; padding: 6px 10px; white-space: pre-wrap;
            border-bottom: 1px solid #ff5a5a;
        }

        .widget-bar {
            position: fixed; bottom: 0; left: 0; width: 100vw; height: 140px;
            display: flex; align-items: stretch; justify-content: space-between;
            background: #000000;
            z-index: 1000; overflow: hidden;
        }

        .module { flex: 1; position: relative; display: flex; flex-direction: column; background: transparent; }
        .map-module { flex: 2; padding: 0; position: relative; overflow: hidden; }
        .module:not(:last-child)::after {
            content: ""; position: absolute; top: 18%; right: 0; width: 1px; height: 64%;
            background: -webkit-linear-gradient(top, rgba(0,242,254,0), rgba(0,242,254,0.15), rgba(0,242,254,0));
            background: linear-gradient(180deg, rgba(0,242,254,0), rgba(0,242,254,0.15), rgba(0,242,254,0));
            z-index: 4;
        }

        .module-header { text-align: center; font-size: 9.5px; font-weight: 700; letter-spacing: 2.4px; color: #94a3b4; text-transform: uppercase; padding-top: 13px; }
        .module-header span { position: relative; display: inline-block; padding-bottom: 7px; }
        .module-header span::after {
            content: ""; position: absolute; bottom: 0; left: 50%; width: 16px; height: 2px; margin-left: -8px; border-radius: 2px;
            background: -webkit-linear-gradient(left, #00f2fe, #4facfe);
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            opacity: .9;
        }

        .module-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; padding: 0 12px 12px 12px; }

        .compass { position: relative; width: 80px; height: 80px; }
        .compass-ring, .compass-needle { position: absolute; top: 0; left: 0; width: 80px; height: 80px; }
        .compass-needle { -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%; -webkit-transition: -webkit-transform 1.1s ease-out; transition: transform 1.1s ease-out; }
        .compass-center { position: absolute; top: 0; left: 0; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
        /* The needle swings on the rim and this dial sits over the hub, so a
           westerly heading can no longer put the pointer through the figure. */
        .compass-dial {
            display: flex; align-items: baseline; justify-content: center;
            min-width: 36px; height: 19px; padding: 0 2px; border-radius: 10px;
            background: rgba(6, 11, 25, 0.82);
            font-size: 15.5px; font-weight: 600; color: #ffffff; letter-spacing: -.2px; line-height: 19px;
        }
        .compass-dial i { font-style: normal; color: #00f2fe; margin-left: 1px; font-size: 12px; }

        .speed-block { margin-left: 16px; text-align: left; }
        .speed-kn { font-size: 23px; font-weight: 600; color: #ffffff; line-height: 1; }
        .speed-kn em { font-style: normal; font-size: 12px; color: #00f2fe; margin-left: 2px; }
        .speed-kmh { font-size: 11px; color: #94a3b4; margin-top: 5px; }
        .course-body { flex-direction: row; }

        .voyage-top { display: flex; align-items: center; }
        .voyage-pin { width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; background: #00f2fe; box-shadow: 0 0 7px rgba(0,242,254,0.7); }
        .voyage-dest { font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; }
        .voyage-arrival { font-size: 11px; color: #00f2fe; font-weight: 600; margin-bottom: 11px; }
        .track { position: relative; width: 82%; height: 5px; border-radius: 4px; background: rgba(255,255,255,0.10); margin-bottom: 9px; }
        .track-fill { position: relative; height: 100%; border-radius: 4px; width: 0%; background: -webkit-linear-gradient(left, #00f2fe, #4facfe); background: linear-gradient(90deg, #00f2fe, #4facfe); }
        .track-dot { position: absolute; right: -3px; top: 50%; margin-top: -4.5px; width: 9px; height: 9px; border-radius: 50%; background: #00f2fe; box-shadow: 0 0 0 2px #090e1a, 0 0 8px 1px #00f2fe; }
        .voyage-stats { display: flex; justify-content: space-between; width: 82%; }
        .voyage-stats .stat { font-size: 11px; color: #94a3b4; }
        .voyage-stats .stat span { color: #ffffff; font-weight: 600; }

        #map { height: 100%; width: 100%; background: #0a0e17; overflow: hidden; }
        .leaflet-container { background: #0a0e17 !important; overflow: hidden !important; }

        /* Weather canvas sits under the coastlines (z-index 400), so the wind
           streaks and swell only ever show on open water. */
        #wx-canvas {
            position: absolute; top: 0; left: 0; z-index: 300; pointer-events: none;
            -webkit-transition: opacity .35s ease; transition: opacity .35s ease;
        }
        #wx-canvas.dim { opacity: 0; }

        /* View changes cross-fade instead of animating: the map is hidden while
           it jumps, so the signage box never has to animate 253 coastlines. */
        #map { -webkit-transition: opacity .55s ease; transition: opacity .55s ease; }
        #map.view-fade { opacity: 0; }

        .wx-pill {
            position: absolute; top: 9px; right: 11px; z-index: 800;
            display: flex; align-items: center;
            font-size: 9.5px; font-weight: 600; letter-spacing: .6px; color: #cbd5e1;
            background: rgba(6, 11, 25, 0.75); border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 3px 8px; border-radius: 20px;
        }
        .wx-pill em { font-style: normal; color: #64748b; margin-left: 2px; }
        .wx-pill .wx-num { color: #ffffff; font-weight: 700; margin-left: 5px; }
        .wx-pill .wx-wave + .wx-num { margin-left: 4px; }
        .wx-arrow {
            width: 11px; height: 11px; margin-right: 5px; display: block;
            -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%;
            -webkit-transition: -webkit-transform 1.2s ease-out; transition: transform 1.2s ease-out;
        }
        .wx-dir { color: #ffb454; font-weight: 700; }
        .wx-wave { width: 16px; height: 8px; margin-left: 9px; display: block; }
        .wx-sep { width: 1px; height: 10px; margin-left: 9px; background: rgba(255,255,255,0.14); }

        /* Leaflet's zoom animation is a single CSS transform on the map pane.
           Lengthening the transition turns a 250ms snap into a slow glide,
           and the whole move stays on the GPU instead of redrawing vectors. */
        .leaflet-zoom-anim .leaflet-zoom-animated {
            -webkit-transition: -webkit-transform 2s cubic-bezier(0.4, 0.02, 0.2, 1) !important;
            transition: transform 2s cubic-bezier(0.4, 0.02, 0.2, 1) !important;
        }

        /* ---------------------------------------------------------------
           ALONGSIDE
           At the quay the chart has nothing left to say - the coastline is
           simplified to about two kilometres, so a harbour is one blue
           shape. So while the vessel is moored the map steps aside and a
           drawn berth takes over: the ship at the quay, lines out, water
           moving. It reads as "we are alongside" from across the room.
           --------------------------------------------------------------- */
        #berth {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 500;
            opacity: 0; pointer-events: none; visibility: hidden;
            -webkit-transition: opacity .9s ease; transition: opacity .9s ease;
        }
        #berth.on { opacity: 1; visibility: visible; }
        #berth svg { width: 100%; height: 100%; display: block; }

        .berth-ship { -webkit-animation: berthBob 7s ease-in-out infinite; animation: berthBob 7s ease-in-out infinite; }
        @-webkit-keyframes berthBob { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-2.5px); } }
        @keyframes berthBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }

        .berth-wave-a { -webkit-animation: berthDrift 19s linear infinite; animation: berthDrift 19s linear infinite; }
        .berth-wave-b { -webkit-animation: berthDrift 31s linear infinite reverse; animation: berthDrift 31s linear infinite reverse; }
        @-webkit-keyframes berthDrift { from { -webkit-transform: translateX(0); } to { -webkit-transform: translateX(-120px); } }
        @keyframes berthDrift { from { transform: translateX(0); } to { transform: translateX(-120px); } }

        .berth-glow { -webkit-animation: berthGlow 4.5s ease-in-out infinite; animation: berthGlow 4.5s ease-in-out infinite; }
        .berth-glow.d1 { -webkit-animation-delay: 1.5s; animation-delay: 1.5s; }
        .berth-glow.d2 { -webkit-animation-delay: 3s; animation-delay: 3s; }
        @-webkit-keyframes berthGlow { 0%,100% { opacity: .10; } 50% { opacity: .42; } }
        @keyframes berthGlow { 0%,100% { opacity: .10; } 50% { opacity: .42; } }

        .berth-lamp { -webkit-animation: berthLamp 6s ease-in-out infinite; animation: berthLamp 6s ease-in-out infinite; }
        .berth-lamp.d1 { -webkit-animation-delay: 2.4s; animation-delay: 2.4s; }
        @-webkit-keyframes berthLamp { 0%,100% { opacity: .55; } 45% { opacity: .95; } }
        @keyframes berthLamp { 0%,100% { opacity: .55; } 45% { opacity: .95; } }

        /* No words in the berth scene at all. The port and the sailing time
           are already in the Voyage Progress panel right beside it, and
           printing them twice - once across the hull - was the whole
           problem. The picture is the picture; the panel does the talking. */

        .coast-pill {
            position: absolute; left: 11px; bottom: 10px; z-index: 800;
            display: none; align-items: center; gap: 8px;
            background: rgba(6, 11, 25, 0.75); border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 4px 10px 4px 8px; border-radius: 20px;
        }
        .coast-pill.on { display: flex; }
        .coast-pill svg { width: 13px; height: 13px; display: block; opacity: .8; }
        .coast-copy { display: flex; flex-direction: column; line-height: 1.3; }
        /* A quiet label, in the same voice as the module headers, so the name
           below it is unmistakably the land and not the destination. */
        .coast-eyebrow { font-size: 7.5px; font-weight: 700; letter-spacing: 1.9px;
            text-transform: uppercase; color: #64748b; }
        .coast-name { font-size: 10px; font-weight: 700; color: #ffffff; letter-spacing: .3px; white-space: nowrap; }
        .coast-name i { font-style: normal; color: #94a3b4; font-weight: 600; }
        .coast-name b { color: #00f2fe; font-weight: 700; margin-left: 7px; }
        .coast-name s { color: rgba(255,255,255,.22); margin: 0 6px; text-decoration: none; }

        .map-vignette { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 450; pointer-events: none; -webkit-box-shadow: inset 0 0 30px 8px rgba(0,0,0,0.95); box-shadow: inset 0 0 30px 8px rgba(0,0,0,0.95); }
        .map-label { position: absolute; top: 9px; left: 11px; z-index: 800; display: flex; align-items: center; font-size: 9px; font-weight: 700; letter-spacing: 1.6px; color: #ffffff; background: rgba(6, 11, 25, 0.75); border: 1px solid rgba(0, 242, 254, 0.2); padding: 3px 7px; border-radius: 20px; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: #00f2fe; }

        .ship-icon { position: relative; background: transparent; border: none; }
        .ship-icon::before {
            content: ""; position: absolute; left: 50%; top: 50%;
            width: 7px; height: 7px; margin-left: -3.5px; margin-top: -3.5px;
            border-radius: 50%; background: #00f2fe;
            box-shadow: 0 0 10px 3px rgba(0,242,254,0.85);
            -webkit-animation: shipPulse 2s infinite; animation: shipPulse 2s infinite;
        }
        @-webkit-keyframes shipPulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
        @keyframes shipPulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
        .ship-arrow {
            position: absolute; left: 0; top: 0; width: 24px; height: 24px; pointer-events: none;
            -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%;
            -webkit-transition: -webkit-transform 0.8s ease-out; transition: transform 0.8s ease-out;
        }
        .ship-arrow::after {
            content: ""; position: absolute; left: 50%; top: 0; margin-left: -6px;
            width: 0; height: 0;
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 13px solid #00f2fe;
            -webkit-filter: drop-shadow(0 0 4px #00f2fe); filter: drop-shadow(0 0 4px #00f2fe);
        }
        .dest-icon { background: #4facfe; border: 2px solid #06121f; border-radius: 50%; box-shadow: 0 0 8px 2px rgba(79,172,254,0.85); }

        /* With no line drawn ahead, the destination has to carry the message
           on its own: a ring breathing out of it, and its name beside it. */
        .dest-mark { position: relative; }
        .dest-mark i {
            position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
            border-radius: 50%; background: #4facfe; box-shadow: 0 0 10px 2px rgba(79,172,254,.8); display: block;
        }
        .dest-mark s {
            position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
            border-radius: 50%; border: 1.5px solid rgba(79,172,254,.9); text-decoration: none;
            -webkit-animation: destPing 3s ease-out infinite; animation: destPing 3s ease-out infinite;
        }
        .dest-mark s.d2 { -webkit-animation-delay: 1.5s; animation-delay: 1.5s; }
        @-webkit-keyframes destPing { 0% { -webkit-transform: scale(1); opacity: .85; } 100% { -webkit-transform: scale(4.2); opacity: 0; } }
        @keyframes destPing { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(4.2); opacity: 0; } }
        .dest-name {
            position: absolute; left: 13px; top: -8px; white-space: nowrap;
            font-size: 10px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase;
            color: #ffffff; text-shadow: 0 1px 5px rgba(0,0,0,.9);
        }
        .dest-name b { display: block; font-size: 7.5px; font-weight: 700; letter-spacing: 1.4px; color: #4facfe; }

        .weather-body { flex-direction: row; }
        .weather-icon { width: 50px; height: 50px; margin-right: 14px; position: relative; display: flex; align-items: center; justify-content: center; }
        .weather-icon .wx { display: none; }
        .weather-icon .wx.show { display: block; }
        .weather-icon .wx svg { width: 48px; height: 48px; display: block; }
        .weather-info { text-align: left; }
        .weather-temp { font-size: 26px; font-weight: 600; color: #ffffff; line-height: 1; }
        .weather-name { font-size: 12px; color: #00f2fe; font-weight: 700; margin-top: 4px; letter-spacing: .5px; }
        .weather-desc { font-size: 10.5px; color: #94a3b4; margin-top: 2px; letter-spacing: .2px; }

        .clock { font-size: 40px; font-weight: 300; color: #ffffff; letter-spacing: 2px; line-height: 1; }
        .clock-underline { width: 46px; height: 2px; margin: 9px auto 0 auto; background: -webkit-linear-gradient(left, #00f2fe, #4facfe); background: linear-gradient(90deg, #00f2fe, #4facfe); }
        .clock-date { font-size: 11px; color: #94a3b4; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
    </style></head><body>

    <div id="errbar"></div>

    <div class="widget-bar">
        <section class="module">
            <div class="module-header"><span>Course &amp; Speed</span></div>
            <div class="module-body course-body">
                <div class="compass">
                    <svg class="compass-ring" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="40" cy="40" r="37" fill="none" stroke="rgba(0,242,254,0.16)" stroke-width="1"/>
                        <circle cx="40" cy="40" r="30" fill="none" stroke="rgba(0,242,254,0.07)" stroke-width="1"/>
                        <g stroke="rgba(255,255,255,0.25)" stroke-width="1.4" stroke-linecap="round">
                            <line x1="40" y1="6"  x2="40" y2="13"/><line x1="40" y1="74" x2="40" y2="67"/><line x1="6"  y1="40" x2="13" y2="40"/><line x1="74" y1="40" x2="67" y2="40"/>
                        </g>
                        <line x1="40" y1="5" x2="40" y2="14" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
                        <text x="40" y="26" text-anchor="middle" font-size="7.5" font-weight="700" fill="#00f2fe" letter-spacing="1">N</text>
                    </svg>
                    <div class="compass-needle" id="compass-needle">
                        <svg viewBox="0 0 80 80"><polygon points="40,6 35.6,15.5 44.4,15.5" fill="#00f2fe"/></svg>
                    </div>
                    <div class="compass-center"><span class="compass-dial"><span id="course-val">0</span><i>&deg;</i></span></div>
                </div>
                <div class="speed-block">
                    <div class="speed-kn"><span id="speed-num">--</span> <em>kn</em></div>
                    <div class="speed-kmh" id="speed-kmh">-- km/h</div>
                </div>
            </div>
        </section>

        <section class="module">
            <div class="module-header"><span>Voyage Progress</span></div>
            <div class="module-body voyage-body">
                <div class="voyage-top"><span class="voyage-pin"></span><span class="voyage-dest" id="voyage-dest">Awaiting...</span></div>
                <div class="voyage-arrival" id="voyage-arrival">--:--</div>
                <div class="track"><div class="track-fill" id="progress-fill"><span class="track-dot"></span></div></div>
                <div class="voyage-stats">
                    <div class="stat"><span id="dist-num">--</span> km</div>
                    <div class="stat">In: <span id="eta-num">--:--</span></div>
                </div>
            </div>
        </section>

        <section class="module map-module">
            <div id="map"></div>
            <canvas id="wx-canvas"></canvas>
            <div id="berth">
                <svg viewBox="0 0 640 140" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="b-sea" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#0d1b2c"/><stop offset="100%" stop-color="#070d18"/>
                        </linearGradient>
                        <linearGradient id="b-refl" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#00f2fe" stop-opacity=".16"/>
                            <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
                        </linearGradient>
                        <pattern id="b-win" width="14" height="24" patternUnits="userSpaceOnUse">
                            <rect x="3" y="5" width="7" height="6" rx="1.3" fill="#00f2fe" opacity=".8"/>
                        </pattern>
                        <pattern id="b-win2" width="12" height="24" patternUnits="userSpaceOnUse">
                            <rect x="2.5" y="4" width="6" height="5" rx="1.2" fill="#00f2fe" opacity=".7"/>
                        </pattern>
                    </defs>

                    <rect width="640" height="140" fill="#0a0e17"/>
                    <g fill="#ffffff" opacity=".45">
                        <circle cx="120" cy="20" r="1"/><circle cx="238" cy="14" r="1.1"/>
                        <circle cx="404" cy="16" r="0.9"/><circle cx="556" cy="24" r="1.1"/>
                    </g>

                    <!-- quay lamps behind the ship -->
                    <g stroke="rgba(255,255,255,.16)" stroke-width="1.3">
                        <line x1="92" y1="40" x2="92" y2="88"/><line x1="588" y1="36" x2="588" y2="88"/>
                    </g>
                    <g fill="#ffb454">
                        <circle class="berth-lamp" cx="92" cy="38" r="2.8"/>
                        <circle class="berth-lamp d1" cx="588" cy="34" r="3"/>
                    </g>

                    <rect x="0" y="98" width="640" height="42" fill="url(#b-sea)"/>
                    <rect x="180" y="99" width="330" height="16" fill="url(#b-refl)"/>
                    <g stroke="#00f2fe" stroke-width="1" opacity=".2" stroke-linecap="round">
                        <line x1="212" y1="106" x2="272" y2="106"/>
                        <line x1="306" y1="111" x2="378" y2="111"/>
                        <line x1="352" y1="103" x2="404" y2="103"/>
                    </g>

                    <!-- MS Norrona, drawn from the ship herself: long white
                         hull with the name forward, four decks of windows,
                         orange boats on their davits amidships, the boxy
                         funnel with its roundel set aft of centre, and the
                         bridge standing well forward above an open foredeck. -->
                    <g class="berth-ship">
                        <path d="M140,86 L152,82 H494 L526,90 L508,100 H150 Z" fill="#0d2130" stroke="rgba(0,242,254,.4)" stroke-width="1"/>
                        <path d="M140,88 L131,100 H152 Z" fill="#0d2130" stroke="rgba(0,242,254,.22)"/>
                        <rect x="152" y="84" width="348" height="2.6" fill="#00f2fe" opacity=".5"/>
                        <rect x="150" y="96.5" width="358" height="1.6" fill="#c85a5a" opacity=".45"/>
                        <text x="318" y="94" text-anchor="middle" font-size="8.5" font-weight="700"
                              letter-spacing="2.2" fill="rgba(226,240,250,.62)">SMYRIL-LINE</text>
                        <text x="196" y="92" text-anchor="middle" font-size="4.6" font-weight="700"
                              letter-spacing=".6" fill="rgba(226,240,250,.5)">NORR&#214;NA</text>

                        <!-- open foredeck with its bulwark, and the anchor -->
                        <path d="M478,82 H508 L520,88" fill="none" stroke="rgba(0,242,254,.3)" stroke-width="1"/>
                        <circle cx="505" cy="92" r="1.6" fill="rgba(226,240,250,.45)"/>

                        <!-- accommodation: big square windows below, cabins above -->
                        <path d="M152,74 H186 V68 H478 V84 H152 Z" fill="#12354a" stroke="rgba(0,242,254,.22)"/>
                        <rect x="192" y="68" width="280" height="16" fill="url(#b-win)"/>
                        <rect x="158" y="76" width="26" height="8" fill="url(#b-win)"/>
                        <rect x="166" y="56" width="290" height="12" rx="2" fill="#154257" stroke="rgba(0,242,254,.22)"/>
                        <rect x="172" y="56" width="280" height="12" fill="url(#b-win2)"/>
                        <rect x="200" y="46" width="200" height="10" rx="2" fill="#17495e" stroke="rgba(0,242,254,.2)"/>

                        <!-- open sun deck aft, with its railing -->
                        <line x1="204" y1="45" x2="282" y2="45" stroke="rgba(0,242,254,.3)" stroke-width=".8"/>
                        <g stroke="rgba(0,242,254,.22)" stroke-width=".7">

    <script>
    (function () {        'use strict';

        var map = null;

        var destinationMap = {
            'torshavn': { name: 'T\u00F3rshavn', country: 'Faroe Islands', latitude: 62.010, longitude: -6.771 },
            'hirtshals': { name: 'Hirtshals', country: 'Denmark', latitude: 57.594, longitude: 9.965 },
            'seydisfjord': { name: 'Sey\u00F0isfj\u00F6r\u00F0ur', country: 'Iceland', latitude: 65.262, longitude: -14.012 }
        };

        /* Shipping lanes as sailed, not as the crow flies: each leg is a set of
           open-water waypoints, so the track bends around Lindesnes and the
           Faroes instead of drawing a line straight over Norway.
           Waypoints are [lat, lon]; a leg is reversed automatically. */
        var SEA_ROUTES = {
            'hirtshals|torshavn': [[57.594,9.965],[57.8,9.3],[57.88,8.3],[57.92,7.0],[58.2,5.5],[58.7,3.6],[59.35,2.0],[60.0,0.9],[60.6,0.1],[61.05,-1.0],[61.45,-3.0],[61.75,-4.9],[61.95,-6.2],[62.0,-6.62],[62.01,-6.771]],
            'torshavn|seydisfjord': [[62.01,-6.771],[62.06,-6.58],[62.45,-6.6],[62.7,-7.3],[63.2,-9.2],[63.95,-11.2],[64.75,-12.85],[65.2,-13.4],[65.262,-14.012]]
        };

        function getRoute(fromKey, toKey) {
            var direct = SEA_ROUTES[fromKey + '|' + toKey];
            if (direct) return direct;
            var reverse = SEA_ROUTES[toKey + '|' + fromKey];
            if (!reverse) return null;
            var out = [], i;
            for (i = reverse.length - 1; i >= 0; i--) out.push(reverse[i]);
            return out;
        }

        function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
        function pad2(n) { return ('0' + n).slice(-2); }
        function withCacheBuster(url) { return url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + (new Date().getTime()); }

        var FAROE_DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var FAROE_MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        var lastSundayDateUTC = function (year, monthIndex) {
            var lastDay = new Date(Date.UTC(year, monthIndex + 1, 0));
            return lastDay.getUTCDate() - lastDay.getUTCDay();
        };
        var isFaroeDST = function (timeMs) {
            var year = new Date(timeMs).getUTCFullYear();
            var dstStart = Date.UTC(year, 2, lastSundayDateUTC(year, 2), 1, 0, 0);
            var dstEnd = Date.UTC(year, 9, lastSundayDateUTC(year, 9), 1, 0, 0);
            return timeMs >= dstStart && timeMs < dstEnd;
        };
        var faroeDate = function (timeMs) {
            var offsetH = isFaroeDST(timeMs) ? 1 : 0;
            return new Date(timeMs + offsetH * 3600000);
        };

        function httpGetJSON(url, timeoutMs, onSuccess, onError) {
            var done = false;
            function fail(e) { if (!done) { done = true; if (onError) onError(e); } }
            function ok(d) { if (!done) { done = true; onSuccess(d); } }
            var xhr;
            try { xhr = new XMLHttpRequest(); } catch (e) { fail(e); return; }
            try { xhr.open('GET', withCacheBuster(url), true); } catch (e2) { fail(e2); return; }
            var hasNativeTimeout = ('timeout' in xhr);
            if (hasNativeTimeout) { xhr.timeout = timeoutMs || 15000; }
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 300) {

                        try { parsed = JSON.parse(xhr.responseText); } catch (e3) { fail(e3); return; }
                        ok(parsed);

            xhr.onerror = function () { fail(new Error('network')); };
            if (!hasNativeTimeout) { setTimeout(function () { if (!done) { try { xhr.abort(); } catch (e4) {} fail(new Error('timeout')); } }, timeoutMs || 15000); }
            try { xhr.send(); } catch (e5) { fail(e5); }
        }

        function normalizeDestinationName(name) {
            if (!name) return '';
            var s = ('' + name).toLowerCase();
            try { if (s.normalize) { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } } catch (e) {}
            s = s.replace(/\u00F0/g, 'd');
            return s.replace(/[^a-z0-9]/g, '');
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function pathLengthKm(pts) {
            var total = 0, i;
            for (i = 0; i < pts.length - 1; i++) {
                total += haversineDistance(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
            }
            return total;
        }

        /* Snap the vessel onto the lane so progress is measured along the track. */
        function projectOnRoute(lat, lon, route) {
            var kx = 111.32 * Math.cos(lat * Math.PI / 180), ky = 110.57;
            var best = { dist: Infinity, index: 0, lat: lat, lon: lon };
            var i, a, b, ax, ay, bx, by, px, py, dx, dy, t, cx, cy, d;
            px = lon * kx; py = lat * ky;
            for (i = 0; i < route.length - 1; i++) {
                a = route[i]; b = route[i + 1];
                ax = a[1] * kx; ay = a[0] * ky; bx = b[1] * kx; by = b[0] * ky;
                dx = bx - ax; dy = by - ay;
                if (dx === 0 && dy === 0) { t = 0; }
                else {
                    t = ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy);
                    if (t < 0) t = 0; else if (t > 1) t = 1;
                }
                cx = ax + t * dx; cy = ay + t * dy;
                d = Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
                if (d < best.dist) {
                    best.dist = d; best.index = i;
                    best.lat = a[0] + t * (b[0] - a[0]);
                    best.lon = a[1] + t * (b[1] - a[1]);
                }
            }
            return best;
        }

        var LANE_MERGE_KM = 90;    /* shortest distance over which we rejoin the lane */
        var LANE_MERGE_MAX_KM = 300;

        function laneTangent(route, index) {
            var a = route[index], b = route[index + 1] || route[index];
            var kx = 111.32 * Math.cos(a[0] * Math.PI / 180), ky = 110.57;
            var dx = (b[1] - a[1]) * kx, dy = (b[0] - a[0]) * ky;
            var len = Math.sqrt(dx * dx + dy * dy);
            if (!len) return { x: 0, y: 1 };
            return { x: dx / len, y: dy / len };
        }

        /* Walk the lane forward from the projection until we are mergeKm along

        function laneAheadPoint(route, proj, mergeKm) {
            var run = 0, i, prev = [proj.lat, proj.lon], step, t;
            for (i = proj.index + 1; i < route.length; i++) {
                step = haversineDistance(prev[0], prev[1], route[i][0], route[i][1]);
                if (run + step >= mergeKm) {
                    t = step > 0 ? (mergeKm - run) / step : 0;
                    return {
                        lat: prev[0] + t * (route[i][0] - prev[0]),
                        lon: prev[1] + t * (route[i][1] - prev[1]),
                        index: i
                    };
                }
                run += step; prev = route[i];
            }
            return { lat: route[route.length - 1][0], lon: route[route.length - 1][1], index: route.length - 1 };
        }

        /* The stretch still to sail.
           The vessel is often nowhere near the estimated lane - a westabout
           passage of Shetland when the lane runs east of it puts us a hundred
           kilometres off. Snapping the drawn line onto the lane produced a
           hard elbow just ahead of the ship, which is not a course anybody
           steers. So the track now LEAVES the vessel on its actual heading and
           curves onto the lane over a distance that grows with how far off we
           are, using a Hermite blend between the two tangents. */
        function remainingPath(lat, lon, route, course) {
            var proj = projectOnRoute(lat, lon, route);
            var offset = Math.abs(signedOffsetKm(lat, lon, route));

            var toGo = 0, i, prev = [proj.lat, proj.lon];
            for (i = proj.index + 1; i < route.length; i++) {
                toGo += haversineDistance(prev[0], prev[1], route[i][0], route[i][1]);
                prev = route[i];
            }

            var mergeKm = offset * 3;
            if (mergeKm < LANE_MERGE_KM) mergeKm = LANE_MERGE_KM;
            if (mergeKm > LANE_MERGE_MAX_KM) mergeKm = LANE_MERGE_MAX_KM;
            if (mergeKm > toGo * 0.65) mergeKm = toGo * 0.65;

            var pts = [[lat, lon]];
            if (mergeKm < 8 || typeof course !== 'number') {

                return pts;
            }

            var target = laneAheadPoint(route, proj, mergeKm);
            var kx = 111.32 * Math.cos(lat * Math.PI / 180), ky = 110.57;
            var x0 = lon * kx, y0 = lat * ky;
            var x1 = target.lon * kx, y1 = target.lat * ky;

               direction where we meet it.

               Their LENGTH is what decides whether this looks like a course or
               like a loop. mergeKm is measured along the lane, but if we are
               far off it, the straight line from here to the meeting point is
               much shorter than that. Scaling the tangents by mergeKm then
               overshoots badly - the curve swings out and comes back, which is
               the big U on the screen. So they are scaled by the CHORD, and
               shortened further when the course disagrees with the direction
               of the meeting point. A tangent can never be longer than the gap
               it has to cross. */
            var chordKm = haversineDistance(lat, lon, target.lat, target.lon);
            var tanLen = (chordKm < mergeKm ? chordKm : mergeKm) * 0.55;

            var cr = course * Math.PI / 180;
            var toTarget = Math.atan2((target.lon - lon) * kx, (target.lat - lat) * ky) * 180 / Math.PI;
            var away = Math.abs(((course - toTarget) % 360 + 540) % 360 - 180);
            var ourLen = tanLen * (away > 80 ? 0.35 : 1);

            var m0x = Math.sin(cr) * ourLen, m0y = Math.cos(cr) * ourLen;

            var m1x = tan.x * tanLen, m1y = tan.y * tanLen;

            var steps = 16, t, h00, h10, h01, h11, px, py, ptLat, ptLon, k, guard;
            for (k = 1; k <= steps; k++) {

                h10 = t * t * t - 2 * t * t + t;
                h01 = -2 * t * t * t + 3 * t * t;
                h11 = t * t * t - t * t;

               will be noticeably longer than simply running to the meeting
               point. In that case draw the plain version instead. */
            var curveKm = 0;

        /* ---------------------------------------------------------------
           DRAWING THE PREDICTION
           The lane ahead is built from recorded positions, and a real vessel
           wanders: a metre of AIS noise here, a small alteration there. Drawn
           straight out, that reads as a series of unnatural kinks and even
           short stretches heading away from where we are going. Nobody steers
           like that, so the predicted line gets cleaned before it is drawn.
           The recorded track behind the ship is never touched - that one is
           supposed to show exactly what happened.
           --------------------------------------------------------------- */

        /* 1. Every point must bring us closer to the destination. Anything
              that does not is noise, and it is what produces the little
              hooks that look like the ship changing its mind. */

                        round4(pts[i - 1][0] * 0.25 + pts[i][0] * 0.5 + pts[i + 1][0] * 0.25),
                        round4(pts[i - 1][1] * 0.25 + pts[i][1] * 0.5 + pts[i + 1][1] * 0.25)

               it left and a course ends at the one it is heading for. Only the
               open-water part in between is worth checking. */
            for (i = 1; i < pts.length - 1; i++) {
                if (onLand(pts[i][0], pts[i][1])) return true;

           so there is no forward-only filter here, only enough of a low pass
           to take out the metre-scale AIS jitter that reads as a scribble at

           back if it would run onto a coast. */

        /* ---------------------------------------------------------------
           SAILED TRACK

           and the next crossing's points get stitched onto the end of the

            } catch (e) {}

        /* ---------------------------------------------------------------

           underway is filed against the leg it belongs to, binned by how far
           along that leg the vessel is, and averaged. After a few crossings

        var LANE_MAX_SLOPE = 0.09;      /* how fast a lane may drift off the estimate: about 5 degrees off its direction */
        var LANE_COURSE_TOLERANCE = 55; /* degrees a lane may disagree with the course being steered */
        var LANE_MIN_SPEED_KN = 5;      /* only learn while genuinely underway */

        var LANE_PREFIX = 'lane_v1_';

        /* ---------------------------------------------------------------
           WIPING WHAT HAS BEEN LEARNED
           There is no way to reach a signage screen to clear its storage, and
           putting #reset in the URL would wipe the memory on every reload.
           So the file carries the instruction instead: change this string,
           upload, and every screen forgets ONCE on its next load, then starts
           learning again. Leave it alone and nothing is lost.
           This clears the screens only - the shared copy lives in Cloudflare,
           so delete the 'store' key in the norrona-lanes KV namespace as well
           if the bad shape came from there.
           --------------------------------------------------------------- */

           the screen" is a question with an answer instead of a guess. */

        /* ---------------------------------------------------------------
           HOW THE TRACK AHEAD IS DRAWN
             'direct'  a straight line from the vessel to the next port.
                       It claims nothing it cannot know.
             'lane'    the learned lane: recorded crossings, the sideways
                       correction, the course check, all of it.
             'destination'
                       nothing drawn but where she is headed: the port marked,
                       named and pulsing, with a short stub off the bow
                       pointing at it. A straight line still reads as a route
                       to most people, and on the Denmark run it lies across
                       Norway. This claims only a direction.
           The lane machinery is still in the file and still works. It just
           guessed wrong too often to be worth showing, so it is switched
           off rather than deleted - one word here brings it back.
           --------------------------------------------------------------- */
        var ROUTE_MODE = 'destination';
        var BEARING_STUB_KM = 70;    /* how far the pointer reaches off the bow */

                for (j = 0; j < ring.length; j++) {
                    if (ring[j][0] < minLat) minLat = ring[j][0];
                    if (ring[j][0] > maxLat) maxLat = ring[j][0];
                    if (ring[j][1] < minLon) minLon = ring[j][1];

                   the waypoints never throws away what has been learned. */
                info = routeProgressInfo(cell[0], cell[1], refRoute);
                slot = Math.floor(info.fraction * LANE_BINS);
                if (slot < 0) slot = 0; else if (slot >= LANE_BINS) slot = LANE_BINS - 1;
                off = signedOffsetKm(cell[0], cell[1], refRoute);
                if (off > LANE_MAX_OFFSET_KM) off = LANE_MAX_OFFSET_KM;
                else if (off < -LANE_MAX_OFFSET_KM) off = -LANE_MAX_OFFSET_KM;
                sums[slot] += off * cell[2];
                weights[slot] += cell[2];
            }
            for (i = 0; i < LANE_BINS; i++) {
                if (weights[i] > 0) { offs[i] = sums[i] / weights[i]; known.push(i); }
            }
            if (known.length < LANE_MIN_BINS) return null;

            /* 2. Fill the unobserved bins. Between two observations we
                  interpolate; beyond the outermost ones we carry the nearest
                  value but let it fade, since we are extrapolating there. */
            var filled = [], lo, hi, span, w, decay;
            for (i = 0; i < LANE_BINS; i++) {
                if (offs[i] !== null) { filled.push(offs[i]); continue; }
                lo = -1; hi = -1;
                for (w = 0; w < known.length; w++) {
                    if (known[w] < i) lo = known[w];
                    if (known[w] > i && hi === -1) hi = known[w];
                }
                if (lo >= 0 && hi >= 0) {
                    span = hi - lo;
                    filled.push(offs[lo] + (offs[hi] - offs[lo]) * ((i - lo) / span));
                } else if (lo >= 0 || hi >= 0) {
                    w = lo >= 0 ? lo : hi;
                    decay = 1 - Math.abs(i - w) / LANE_EXTRAPOLATE_BINS;
                    if (decay < 0) decay = 0;
                    filled.push(offs[w] * decay);
                } else {

                }

            var smoothed = [], j, sum, n;
            for (i = 0; i < LANE_BINS; i++) {

                    sum += filled[j]; n++;

            }

            /* 3b. A ship does not step sideways. Where only part of a passage
                   has ever been observed, the correction found there can swing
                   the lane out and let it fall back over the unobserved
                   stretch - a bulge that reads as a U on the screen even
                   though every point of it is smooth. So the lane is allowed
                   to drift away from the estimate only gradually: at most
                   about seven degrees off the estimate's own direction,
                   enforced in both directions along the passage. */
            var stepKm = pathLengthKm(refRoute) / (LANE_BINS - 1);
            var cap = stepKm * LANE_MAX_SLOPE;
            for (i = 1; i < LANE_BINS; i++) {
                if (smoothed[i] > smoothed[i - 1] + cap) smoothed[i] = smoothed[i - 1] + cap;
                else if (smoothed[i] < smoothed[i - 1] - cap) smoothed[i] = smoothed[i - 1] - cap;
            }
            for (i = LANE_BINS - 2; i >= 0; i--) {
                if (smoothed[i] > smoothed[i + 1] + cap) smoothed[i] = smoothed[i + 1] + cap;
                else if (smoothed[i] < smoothed[i + 1] - cap) smoothed[i] = smoothed[i + 1] - cap;

                  always arrives at the quay rather than beside it. */
            var frac, taper;
            for (i = 0; i < LANE_BINS; i++) {

                if (taper > 1) taper = 1; else if (taper < 0) taper = 0;
                smoothed[i] *= taper;

            /* 5. Walk the reference and step each point sideways. */
            var samples = routeSamples(refRoute, LANE_BINS - 1), lane = [];
            for (i = 0; i < samples.length; i++) {

               a headland. Pull the pair in until the crossing is clear. */
            var pass, hit, midLat, midLon;
            for (pass = 0; pass < 5; pass++) {
                hit = false;
                for (i = 0; i < lane.length - 1; i++) {

                    midLon = (lane[i][1] + lane[i + 1][1]) / 2;
                    if (!onLand(midLat, midLon)) continue;
                    hit = true;
                    smoothed[i] = (smoothed[i] || 0) * 0.7;
                    smoothed[i + 1] = (smoothed[i + 1] || 0) * 0.7;
                    lane[i] = safeShift(samples[i], smoothed[i]);
                    lane[i + 1] = safeShift(samples[i + 1], smoothed[i + 1]);
                }
                if (!hit) break;
            }

            lane[0] = [refRoute[0][0], refRoute[0][1]];
            lane[lane.length - 1] = [refRoute[refRoute.length - 1][0], refRoute[refRoute.length - 1][1]];

            store.lane = lane;
            return store.lane;
        }

        /* ---------------------------------------------------------------
           IS THIS LANE EVEN PLAUSIBLE?
           The Worker merges what every screen has learned, weighted by how
           much each has seen. That is right for two recordings of the SAME
           passage - and wrong for two different ones. Average an eastabout
           and a westabout crossing of Shetland and you get a line that is
           neither: it swings out towards one and back towards the other.
           That is the big U, and no amount of smoothing can fix it, because
           the shape is really in the data.

           So a learned lane now has to earn the right to be drawn. It may be
           longer than the estimate, but not much. It may run wide of it, but
           not absurdly. And it must always make progress along the passage -
           a lane that goes backwards is a blend of two routes, not a route.
           Anything that fails goes back to the plain waypoints, which are
           never pretty but never wrong.
           --------------------------------------------------------------- */

        var LANE_SANE_BACKSTEP = 0.03; /* how much sliding backwards is tolerated */

            if (!lane || lane.length < 3 || !reference) return false;

            var refKm = pathLengthKm(reference), laneKm = pathLengthKm(lane);
            if (refKm > 0 && laneKm > refKm * LANE_SANE_LENGTH + 20) return false;

            var i, off, info, prev = -1, prevOff = 0, step;
            for (i = 0; i < lane.length; i++) {
                off = Math.abs(signedOffsetKm(lane[i][0], lane[i][1], reference));
                if (off > LANE_MAX_OFFSET_KM) return false;

                info = routeProgressInfo(lane[i][0], lane[i][1], reference);
                if (prev >= 0) {
                    step = info.fraction - prev;
                    if (step < -LANE_SANE_BACKSTEP) return false;
                    /* And no sideways lurching, however smooth it looks. */
                    if (step > 0 && Math.abs(off - prevOff) > step * refKm * LANE_MAX_SLOPE * 2.5 + 4) return false;
                }

           runs south-west while the ship steers north-west is not the passage
           being sailed, however smooth it is - and drawn from the ship it goes
           down, across and back up again. That is the U. Heading is the one
           signal that settles it, because it says what the bridge is doing
           right now rather than what some earlier crossing did. */

            if (typeof course !== 'number' || isNaN(course)) return true;
            if (!lane || lane.length < 2) return true;
            var proj = projectOnRoute(lat, lon, lane);
            var t = laneTangent(lane, proj.index);

            var reference = getRoute(fromKey, toKey);

                    laneAgreesWithCourse(matched, lat, lon, course)) return matched;

            if (learned && laneIsSane(learned, reference) &&
                laneAgreesWithCourse(learned, lat, lon, course)) return learned;
            return reference;
        }

        /* ---------------------------------------------------------------

           --------------------------------------------------------------- */

           Worker, and remembers the value so it only happens once. This is
           the way in for screens whose page lives inside the signage system,
           where there is no address to put #reset on. */

                if (laneApplyRemoteReset(data)) return;   /* wiped: take nothing this round */

                list = histLoad(key);
                merged = list.slice(0);

                    }

        /* ---------------------------------------------------------------

           depending on the weather. Averaging those two produces a line
           straight through Shetland - a route nobody has ever sailed. So
           completed crossings are kept whole, and the one that matches where
           the vessel actually is now gets drawn.
           --------------------------------------------------------------- */
        var HIST_PREFIX = 'hist_v1_';

        var HIST_POINTS = 120;      /* thinned to this before storing */
        var HIST_MIN_POINTS = 25;

        var HIST_START_KM = 45;     /* a track must start near the departure quay */

                } catch (e2) { list = []; }

           so after thinning we put points back wherever that happened. */

            for (i = 0; i < target; i++) idx.push(Math.round(i * step));

            for (pass = 0; pass < 4; pass++) {

                    midLat = (a[0] + b[0]) / 2; midLon = (a[1] + b[1]) / 2;
                    mid = Math.round((idx[i - 1] + idx[i]) / 2);

            if (!pts || pts.length < HIST_MIN_POINTS) return;
            if (departurePort &&
                haversineDistance(pts[0][0], pts[0][1], departurePort.latitude, departurePort.longitude) > HIST_START_KM) {
                return;   /* the screen joined late - a partial track is not a variant */
            }
            var list = histLoad(key);

            histSave(key, list);

        }

        /* Read the learned lanes out of a device: call norronaLanes() in the

        /* ---------------------------------------------------------------
           DEPARTURE TIMES
           Taken from Smyril Line's published check-in windows, which close
           exactly one hour before departure, on smyrilline.com/sailing-schedule.
           Each block carries the dates it is valid for, because the schedule
           changes with the season - a summer time shown in September is what
           was wrong here before.

           block expires, the screen goes quiet rather than quietly lying.
           To extend it, read the check-in windows off the schedule page and
           add a block; weekday 0 is Sunday.

           PORT_TIME_SHIFT below turns them into ship time.

           --------------------------------------------------------------- */
        var DEPARTURE_SCHEDULE = [
            /* Hirtshals - check-in Sat 12:00-14:30 and Tue 08:30-10:30 in summer,
               Sun 12:00-14:00 from mid-September */
            { port: 'hirtshals',   from: '2026-05-30', to: '2026-09-01', days: { 6: '15:30', 2: '11:30' } },

            /* Torshavn - Wed, Fri and Sun in summer; Tue and Fri from 11 September */

           all year, wherever she happens to be.

           for every port, so it is set per port rather than calculated:

                              schedule prints as 20:00 is 20:00 on board, not
                              21:00. Smyril Line are a Faroese company and the
                              Iceland times are already in ship time. Working
                              it out from the clocks gave an hour too many.

           --------------------------------------------------------------- */

            try {

            } catch (e) {}

        function activeSchedule() {

               same thing read fresh. One-off sailings do NOT replace: they are
               merged, live first. Losing a known departure because the Worker
               parsed the notice differently would be the worst of both. */

            var exceptions = (live && live.exceptions ? live.exceptions : []).concat(DEPARTURE_EXCEPTIONS);

        function plannedDeparture(portKey) {
            var now = new Date().getTime();
            var f = faroeDate(now);
            var today = f.getUTCFullYear() + '-' + pad2(f.getUTCMonth() + 1) + '-' + pad2(f.getUTCDate());
            var shift = portShiftToShip(portKey, now);

            var i, block, table, time, parts, minutesDep, localDay, shipDay, ex, shipDate;

            var source = activeSchedule();

            /* One-off sailings first. */
            for (i = 0; i < source.exceptions.length; i++) {
                ex = source.exceptions[i];
                if (ex.port !== portKey) continue;
                parts = ex.local.split(':');
                minutesDep = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) + shift;
                shipDate = ex.date;
                if (minutesDep < 0) { minutesDep += 1440; shipDate = shiftDay(ex.date, -1); }
                else if (minutesDep >= 1440) { minutesDep -= 1440; shipDate = shiftDay(ex.date, 1); }
                if (shipDate !== today) continue;
                if (minutesNow > minutesDep + LATE_GRACE_MIN) continue;
                return { time: hhmm(minutesDep), late: minutesNow > minutesDep + 15 };
            }

            for (i = 0; i < source.blocks.length; i++) {
                block = source.blocks[i];
                if (block.port !== portKey) continue;
                if (today < block.from || today > block.to) continue;
                table = block.days;
                if (!table) continue;

                for (localDay in table) {
                    if (!table.hasOwnProperty(localDay)) continue;
                    time = table[localDay];

                    if (minutesDep < 0) { minutesDep += 1440; shipDay = (shipDay + 6) % 7; }
                    else if (minutesDep >= 1440) { minutesDep -= 1440; shipDay = (shipDay + 1) % 7; }

                    if (minutesNow > minutesDep + LATE_GRACE_MIN) continue;
                    return { time: hhmm(minutesDep), late: minutesNow > minutesDep + 15 };

        }

            setMapFaded(true);

            fadeCutTimer = setTimeout(function () {
                /* Invisible while it moves: the jump and the coastline redraw
                   both happen behind a blank panel. */
                moveMapNow({ animate: false });
                fadeInTimer = setTimeout(function () {
                    setMapFaded(false);
                    wxLastFrame = 0;
                    wxPaused = false;
                }, 120);
            }, FADE_MS + 60);
        }

        function scheduleViewCycle() {
            if (viewTimer) { clearTimeout(viewTimer); }
            viewTimer = setTimeout(function () {
                if (!berthOn) {
                    viewMode = (viewMode === 0 && viewBounds) ? 1 : 0;
                    applyView(true);
                }
                scheduleViewCycle();
            }, viewMode === 1 ? 12000 : 20000);
        }

        var berthOn = false;

        function showBerth(portName, sailingText) {
            var el = document.getElementById('berth');
            berthOn = true;
            /* The pill names the port, so a glance at the map panel alone
               still says where she is. */
            setText('map-label-text', portName ? ('Alongside ' + portName) : 'Alongside');
            var dot = document.getElementById('live-dot');
            if (dot) { dot.style.webkitAnimation = 'none'; dot.style.animation = 'none'; }
            if (el) { el.className = 'on'; }
            var coast = document.getElementById('coast-pill');
            if (coast) { coast.className = 'coast-pill'; }
        }

        function hideBerth() {
            if (!berthOn) return;
            berthOn = false;
            var el = document.getElementById('berth');
            if (el) { el.className = ''; }
            setText('map-label-text', 'Live Position');
            var dot = document.getElementById('live-dot');
            if (dot) { dot.style.webkitAnimation = ''; dot.style.animation = ''; }
        }

        function setHarbourView(latlng) {
            viewShip = latlng; viewShipZoom = 8; viewBounds = null; viewMode = 0;
            applyView(false);
        }

        function setMapView(currentLatLng, departureLatLng, destinationLatLng, routePts) {
            var distToDest = haversineDistance(currentLatLng[0], currentLatLng[1], destinationLatLng[0], destinationLatLng[1]);
            var zoom;
            if (distToDest < 12) { zoom = 8; }
            else if (distToDest < 45) { zoom = 8; }
            else if (distToDest < 130) { zoom = 7; }
            else { zoom = 6; }
            viewShip = currentLatLng; viewShipZoom = zoom;
            viewBounds = (routePts && routePts.length > 1) ? L.latLngBounds(routePts) : null;
            applyView(false);
        }

        function updatePremiumUI(course, speedKnots, speedKmh) {
            var deg = (course || 0);
            setText('course-val', deg.toFixed(0));
            var needle = document.getElementById('compass-needle');
            if (needle) { needle.style.webkitTransform = 'rotate(' + deg + 'deg)'; needle.style.transform = 'rotate(' + deg + 'deg)'; }
            setText('speed-num', speedKnots.toFixed(1));
            setText('speed-kmh', speedKmh + ' km/h');
        }

        function setProgress(pct) { var el = document.getElementById('progress-fill'); if (el) el.style.width = pct + '%'; }

        function displayCachedData(c) {
            if (!c) return;
            if (c.course && c.speedKnots && c.speedKmh) { updatePremiumUI(c.course, c.speedKnots, c.speedKmh); }

            setText('voyage-dest', c.destText || 'Awaiting...');
            setText('voyage-arrival', c.arrivalText || '--:--');
            setText('dist-num', (c.distText === undefined ? '--' : c.distText));
            setText('eta-num', c.etaText || '--:--');
            if (c.progressPercent !== undefined) setProgress(c.progressPercent);
            setText('dest-name', c.destText || 'N/A');

            if (!map) return;
            clearMapLayers();
            if (c.currentLatLng) {
                updateNearestCoast(c.currentLatLng[0], c.currentLatLng[1]);
                currentMarker = addShipMarker(c.currentLatLng, c.course);
                if (c.isInHarbour) {
                    setHarbourView(c.currentLatLng);
                    showBerth(c.destText, c.arrivalText);
                } else if (c.destLatLng && c.departureLatLng) {
                    hideBerth();
                    destinationMarker = L.marker(c.destLatLng, { icon: destinationIcon(c.destText), zIndexOffset: 500 }).addTo(map);
                    var cachedRoute = (ROUTE_MODE === 'lane' && c.routeFrom && c.routeTo)
                        ? laneForLeg(c.routeFrom, c.routeTo, c.currentLatLng[0], c.currentLatLng[1], c.course) : null;
                    var cachedTrail = (c.routeFrom && c.routeTo) ? trailLoad(c.routeFrom + '|' + c.routeTo) : null;
                    if (cachedRoute) {
                        var cachedRemaining = remainingPath(c.currentLatLng[0], c.currentLatLng[1], cachedRoute, c.course);
                        cachedRemaining[cachedRemaining.length - 1] = c.destLatLng;
                        drawRoute(cachedRemaining, cachedRoute, cachedTrail);
                    } else {
                        drawRoute([c.currentLatLng, c.destLatLng], null, cachedTrail);
                    }
                    setMapView(c.currentLatLng, c.departureLatLng, c.destLatLng,
                        (cachedTrail && cachedTrail.length ? cachedTrail : []).concat(cachedRoute || [c.currentLatLng, c.destLatLng]));
                }
            }
        }

        function handleShipError() { var c = loadCachedData(); if (c) displayCachedData(c); }

        function processShipData(data) {
            var isArr = (typeof Array.isArray === 'function') ? Array.isArray(data) : (data instanceof Array);
            if (!data || !isArr || data.length === 0) throw new Error('API returned empty or invalid data');

            var norrona = null, i;
            for (i = 0; i < data.length; i++) {
                if (data[i] && data[i].vesselName && data[i].vesselName.toUpperCase() === 'NORRONA') { norrona = data[i]; break; }
            }
            if (!norrona || !norrona.position || !norrona.destinationFromAIS) throw new Error('Norrona data incomplete');

            var latitude = norrona.position.latitude, longitude = norrona.position.longitude;
            var speedKnots = norrona.position.speed || 0, speedKmh = (speedKnots * 1.852).toFixed(1), course = norrona.position.course;

            updatePremiumUI(course, speedKnots, speedKmh);
            updateNearestCoast(latitude, longitude);
            clearMapLayers();

            var finalDestNameNormalized = normalizeDestinationName(norrona.destinationFromAIS.split(',')[0]);
            var finalDestInfo = destinationMap[finalDestNameNormalized];
            if (!finalDestInfo) throw new Error('Destination not found');

            var cachedDepartureKey = lsGet('lastKnownPort');
            var nextStopInfo = buildStopInfo(finalDestNameNormalized, finalDestInfo);

            /* Norrona calls at Torshavn on the Denmark-Iceland passage. Work out
               the next physical leg first, then resolve its departure from AIS. */
            if ((cachedDepartureKey === 'hirtshals' && finalDestNameNormalized === 'seydisfjord') ||
                (cachedDepartureKey === 'seydisfjord' && finalDestNameNormalized === 'hirtshals')) {
                nextStopInfo = buildStopInfo('torshavn', destinationMap['torshavn']);
            }
            var departureInfoKey = resolveDeparturePort(nextStopInfo.key, latitude, longitude, cachedDepartureKey);

            /* If stale storage picked a final destination with no lane, fall
               back to Torshavn as the intermediate stop. */
            if (!getRoute(departureInfoKey, nextStopInfo.key) &&
                nextStopInfo.key !== 'torshavn' && destinationMap['torshavn']) {
                nextStopInfo = buildStopInfo('torshavn', destinationMap['torshavn']);
                departureInfoKey = resolveDeparturePort(nextStopInfo.key, latitude, longitude, cachedDepartureKey);
            }
            var nextStopDisplayName = nextStopInfo.name;
            setText('dest-name', nextStopDisplayName);

            var currentHarbour = findClosestHarbour(latitude, longitude);
            var speedKnotsInt = Math.floor(speedKnots);
            var isInHarbour = currentHarbour && speedKnotsInt < 1;
            var newCachedData = {};
            currentMarker = addShipMarker([latitude, longitude], course);

            if (isInHarbour) {
                journeyIsActive = false; currentETA = null;

                /* No more guessing. The old block here carried a hardcoded
                   summer timetable, which is why the screen announced a
                   sailing at 18:00 in September - that was the summer
                   Wednesday departure from Torshavn, and the winter schedule
                   is a different day and a different hour entirely.

                   A departure time is now only shown when the vessel itself
                   reports one over AIS, or when a real timetable has been
                   entered below. Otherwise the line stays empty. A blank is
                   honest; a wrong time is not. */
                var reportedDeparture = norrona.scheduledDeparture || norrona.etd ||
                                        norrona.departureFromAIS || norrona.atd || null;
                var timeString = '';
                var reported = fmtDeparture(reportedDeparture);
                if (reported) {
                    timeString = 'Sailing ' + reported;
                } else {
                    /* Said plainly: this is the timetable, not the bridge. */
                    var planned = plannedDeparture(currentHarbour.key);
                    if (planned) {
                        timeString = 'Scheduled ' + planned.time + (planned.late ? ' - delayed' : '');
                    } else {
                        /* Better than a blank line: it says the screen looked
                           and found nothing, rather than looking broken. */
                        timeString = 'No scheduled sailing today';
                    }
                }

                setText('voyage-dest', currentHarbour.name);
                setText('voyage-arrival', timeString);
                setText('dist-num', '0');
                setText('eta-num', '--:--');
                setProgress(100);

                setHarbourView([latitude, longitude]);
                showBerth(currentHarbour.name, timeString);
                /* Alongside: the leg just sailed is finished, so retire its track,
                   and make sure nothing stale is left for the legs out of here. */
                var finishedKey = departureInfoKey + '|' + currentHarbour.key;
                histArchive(finishedKey, trailLoad(finishedKey), destinationMap[departureInfoKey]);
                trailClear(finishedKey);
                var outboundKey;
                for (outboundKey in destinationMap) {
                    if (destinationMap.hasOwnProperty(outboundKey) && outboundKey !== currentHarbour.key) {
                        trailClear(currentHarbour.key + '|' + outboundKey);
                    }
                }
                lsSet('lastKnownPort', currentHarbour.key);

                newCachedData = { isInHarbour: true, distText: '0', etaText: '--:--', destText: currentHarbour.name, arrivalText: timeString, progressPercent: 100, currentLatLng: [latitude, longitude] };
            } else {
                journeyIsActive = true; currentETA = new Date(norrona.etaFromAIS);
                hideBerth();

                var departureInfo = destinationMap[departureInfoKey];
                if (!departureInfo) throw new Error('Departure port not found');
                lsSet('lastKnownPort', departureInfoKey);

                /* In 'direct' mode nothing is guessed about the route: the line
                   runs straight from the vessel to the next port. The track
                   behind her is still her real track. */
                var referenceRoute = (ROUTE_MODE === 'lane') ? getRoute(departureInfoKey, nextStopInfo.key) : null;
                if (referenceRoute) {
                    recordFix(departureInfoKey, nextStopInfo.key, latitude, longitude, referenceRoute, speedKnots);
                }
                var legRoute = referenceRoute ? laneForLeg(departureInfoKey, nextStopInfo.key, latitude, longitude, course) : null;
                var legKey = departureInfoKey + '|' + nextStopInfo.key;
                var sailedTrack = trailRecord(legKey, latitude, longitude);
                var remaining, totalDistance;
                if (legRoute) {
                    remaining = remainingPath(latitude, longitude, legRoute, course);
                    remaining[remaining.length - 1] = [nextStopInfo.latitude, nextStopInfo.longitude];
                    totalDistance = pathLengthKm(legRoute);
                    currentDistanceKm = Math.round(pathLengthKm(remaining));
                } else {
                    remaining = [[latitude, longitude], [nextStopInfo.latitude, nextStopInfo.longitude]];
                    totalDistance = haversineDistance(departureInfo.latitude, departureInfo.longitude, nextStopInfo.latitude, nextStopInfo.longitude);
                    currentDistanceKm = Math.round(haversineDistance(latitude, longitude, nextStopInfo.latitude, nextStopInfo.longitude));
                }

                var staticEtaString = formatStaticETA(currentETA);
                var progressPercent = totalDistance > 0 ? Math.max(0, Math.min(100, ((totalDistance - currentDistanceKm) / totalDistance) * 100)) : 0;

                setText('voyage-dest', nextStopDisplayName);
                setText('voyage-arrival', 'Arrival: ' + staticEtaString);
                setText('dist-num', '' + currentDistanceKm);
                setText('eta-num', 'Calculating...');
                setProgress(progressPercent);

                destinationMarker = L.marker([nextStopInfo.latitude, nextStopInfo.longitude],
                    { icon: destinationIcon(nextStopDisplayName), zIndexOffset: 500 }).addTo(map);
                setMapView([latitude, longitude], [departureInfo.latitude, departureInfo.longitude], [nextStopInfo.latitude, nextStopInfo.longitude], (sailedTrack && sailedTrack.length ? sailedTrack : []).concat(remaining));
                drawRoute(remaining, legRoute, sailedTrack);

                newCachedData = { isInHarbour: false, distText: '' + currentDistanceKm, etaText: 'Calculating...', destText: nextStopDisplayName, arrivalText: 'Arrival: ' + staticEtaString, progressPercent: progressPercent, currentLatLng: [latitude, longitude], destLatLng: [nextStopInfo.latitude, nextStopInfo.longitude], departureLatLng: [departureInfo.latitude, departureInfo.longitude], routeFrom: departureInfoKey, routeTo: nextStopInfo.key };
            }

            newCachedData.course = course; newCachedData.speedKnots = speedKnots; newCachedData.speedKmh = speedKmh;
            saveCachedData(newCachedData);
            fetchWeather(nextStopInfo.latitude, nextStopInfo.longitude);
            fetchSeaState(latitude, longitude);
        }

        function updateShipData() {
            if (!map) return;
            httpGetJSON('https://smyrillinewebapi-cec3fkhjh8bbhtd3.northeurope-01.azurewebsites.net/vessel/vessels', 15000,
                function (data) { try { processShipData(data); } catch (error) { handleShipError(); } },
                function () { handleShipError(); });
        }

        function updateCountdown() {
            if (!journeyIsActive || !currentETA || isNaN(currentETA.getTime())) return;
            var diff = currentETA.getTime() - new Date().getTime(), countdownString;
            if (diff <= 0) { countdownString = 'Arriving Soon'; journeyIsActive = false; }
            else {
                var days = Math.floor(diff / (1000 * 60 * 60 * 24)), hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)), minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                countdownString = (days > 0 ? days + 'd ' : '') + pad2(hours) + 'h ' + pad2(minutes) + 'm';
            }
            setText('dist-num', '' + currentDistanceKm);
            setText('eta-num', countdownString.replace(/^\s+|\s+$/g, ''));
        }

        function updateTime() {
            var nowMs = new Date().getTime();
            var dst = isFaroeDST(nowMs);
            var f = faroeDate(nowMs);
            setText('current-time', pad2(f.getUTCHours()) + ':' + pad2(f.getUTCMinutes()));
            setText('current-date', FAROE_DAY_NAMES[f.getUTCDay()] + ', ' + f.getUTCDate() + ' ' + FAROE_MONTH_NAMES[f.getUTCMonth()] + ' \u00B7 GMT' + (dst ? '+1' : '+0'));
        }

        /* Wipe everything this screen has learned. Load the page with #reset
           on the URL, or call norronaForget() in the console. Note that it
           pulls the shared memory again afterwards, so if the bad shape came
           from the Worker, delete the 'store' key in KV as well. */
        function norronaForget() {
            var keys = laneLegKeys(), i;
            for (i = 0; i < keys.length; i++) {
                try {
                    localStorage.removeItem(LANE_PREFIX + keys[i]);
                    localStorage.removeItem(TRAIL_PREFIX + keys[i]);
                    localStorage.removeItem(HIST_PREFIX + keys[i]);
                } catch (e) {}
            }
            laneStore = {}; trailKey = null; trailPts = [];
            return 'forgotten';
        }

        /* Why is there no time on the screen? Call norronaSchedule() in the
           console and it says which source is in use, what today is in ship
           time, and what it found for each port. */
        function norronaSchedule() {
            var source = activeSchedule();
            var f = faroeDate(new Date().getTime());
            var out = {
                build: WIDGET_BUILD,
                using: (liveSchedule && liveSchedule.blocks && liveSchedule.blocks.length) ? 'live from the Worker' : 'built-in table',
                shipDate: f.getUTCFullYear() + '-' + pad2(f.getUTCMonth() + 1) + '-' + pad2(f.getUTCDate()),
                shipTime: pad2(f.getUTCHours()) + ':' + pad2(f.getUTCMinutes()),
                shipWeekday: FAROE_DAY_NAMES[f.getUTCDay()],
                blocks: source.blocks.length,
                exceptions: source.exceptions.length,
                notice: liveSchedule ? liveSchedule.notice : '',
                shows: {}
            };
            var ports = ['torshavn', 'hirtshals', 'seydisfjord'], i, p;
            for (i = 0; i < ports.length; i++) {
                p = plannedDeparture(ports[i]);
                out.shows[ports[i]] = p ? (p.time + (p.late ? ' (delayed)' : '')) : 'nothing';
            }
            return out;
        }

        if (window) {
            window.norronaBuild = function () { return WIDGET_BUILD; };
            if (window.console && console.log) { console.log('Norrona widget build: ' + WIDGET_BUILD); }
            window.norronaSchedule = norronaSchedule;
            window.norronaLanes = norronaLanes;
            window.norronaForget = norronaForget;

            /* Either way of asking: a new token in the file, or #reset on the
               address for a one-off from a browser. */
            if (lsGet('lane_resetToken') !== LANE_RESET_TOKEN) {
                norronaForget();
                lsSet('lane_resetToken', LANE_RESET_TOKEN);
            }
            if (window.location && window.location.hash === '#reset') { norronaForget(); }
        }

        setInterval(updateTime, 1000);
        setInterval(updateCountdown, 1000);

        var SEA_FILL = '#0a0e17';

        /* ---------------------------------------------------------------
           NEAREST LAND
           Two things, from data already in this file: how far the nearest
           coastline is (measured to the coast segments, not to a sampled
           point), and what that piece of land is called. Fully offline.

           Notes on the earlier version:
             - it densified every coastline edge into samples every 12 km,
               which is tens of thousands of points held in memory on a
               signage box. The rings are already about 2 km apart, so we
               measure to the segments directly and keep nothing.
             - country boxes overlapped: Sweden's west coast sits inside the
               Norway box, so Gothenburg came out as Norway. Named places
               carry their own country, so there are no boxes to overlap.
             - flag emoji and bullet characters are not ASCII. This file has
               to stay ASCII-clean for the CMS, and Tizen renders flag emoji
               as letter pairs anyway.
