        function bearingTo(lat1, lon1, lat2, lon2) {
            var r = Math.PI / 180;
            var y = Math.sin((lon2 - lon1) * r) * Math.cos(lat2 * r);
            var x = Math.cos(lat1 * r) * Math.sin(lat2 * r) -
                    Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos((lon2 - lon1) * r);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        /* Closest point on the coastline itself, walking the ring segments.
           A latitude gate skips most of the map before any trigonometry. */
        function nearestCoastPoint(lat, lon) {
            var kx = 111.32 * Math.cos(lat * Math.PI / 180), ky = 110.57;
            var px = lon * kx, py = lat * ky;
            var bestD2 = Infinity, bestLat = 0, bestLon = 0;
            var i, j, ring, a, b, ax, ay, bx, by, dx, dy, t, cx, cy, d2, gate;

            gate = 1200;   /* km, shrinks as soon as anything closer is found */
            for (i = 0; i < LAND_RINGS.length; i++) {
                ring = LAND_RINGS[i];
                for (j = 0; j < ring.length - 1; j++) {
                    a = ring[j];
                    if (Math.abs(a[0] - lat) * ky > gate) continue;
                    b = ring[j + 1];
                    ax = a[1] * kx; ay = a[0] * ky; bx = b[1] * kx; by = b[0] * ky;
                    dx = bx - ax; dy = by - ay;
                    if (dx === 0 && dy === 0) { t = 0; }
                    else {
                        t = ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy);
                        if (t < 0) t = 0; else if (t > 1) t = 1;
                    }
                    cx = ax + t * dx; cy = ay + t * dy;
                    d2 = (px - cx) * (px - cx) + (py - cy) * (py - cy);
                    if (d2 < bestD2) {
                        bestD2 = d2;
                        bestLat = a[0] + t * (b[0] - a[0]);
                        bestLon = a[1] + t * (b[1] - a[1]);
                        gate = Math.sqrt(d2) + 60;
                    }
                }
            }
            if (bestD2 === Infinity) return null;
            return { lat: bestLat, lon: bestLon, km: haversineDistance(lat, lon, bestLat, bestLon) };
        }

        function nearestPlace(lat, lon) {
            var best = null, bestD = Infinity, i, d;
            for (i = 0; i < COAST_PLACES.length; i++) {
                d = haversineDistance(lat, lon, COAST_PLACES[i][0], COAST_PLACES[i][1]);
                if (d < bestD) { bestD = d; best = COAST_PLACES[i]; }
            }
            return best ? { name: best[2], country: best[3], km: bestD, town: best[4] === 1 } : null;
        }

        function updateNearestCoast(lat, lon) {
            var pill = document.getElementById('coast-pill');
            if (!pill || typeof lat !== 'number' || typeof lon !== 'number') return;

            var coast = nearestCoastPoint(lat, lon);
            if (!coast) { pill.className = 'coast-pill'; return; }

            /* Name the land by whatever is closest to the coast we found,
               not to the ship - otherwise a landfall reads as the town
               astern of us rather than the one we are looking at. */
            var place = nearestPlace(coast.lat, coast.lon);
            setText('coast-label', (place && place.town) ? 'Nearest city' : 'Nearest coast');
            setText('coast-place', place ? place.name : 'Land');
            setText('coast-country', place ? (', ' + place.country) : '');
            setText('coast-km', Math.max(1, Math.round(coast.km)) + ' km');
            setText('coast-dir', bearingToCardinal(bearingTo(lat, lon, coast.lat, coast.lon)));
            pill.className = berthOn ? 'coast-pill' : 'coast-pill on';
        }

        function drawBasemap() {
            if (!map) return;
            var i;
            for (i = 0; i < LAND_RINGS.length; i++) {
                L.polygon(LAND_RINGS[i], {
                    stroke: true,
                    color: COAST_LINE,
                    weight: 0.9,
                    fill: true,
                    fillColor: LAND_FILL,
                    fillOpacity: 1,
                    interactive: false
                }).addTo(map);
            }
        }

        var leafletTries = 0;
        function startMap() {
            if (typeof L === 'undefined' || !L.map) {
                leafletTries++;
                if (leafletTries === 12) {
                    showErrBar('MAP: Leaflet did not load from unpkg.com (check network access).');
                }
                if (leafletTries <= 40) { setTimeout(startMap, 250); }
                return;
            }

            shipIcon = L.divIcon({ className: 'ship-icon', iconSize: [24, 24], iconAnchor: [12, 12] });
            defaultIcon = L.divIcon({ className: 'dest-icon', iconSize: [14, 14], iconAnchor: [7, 7] });

            map = L.map('map', {
                zoomControl: false, attributionControl: false,
                maxZoom: 8, minZoom: 4, preferCanvas: true,
                zoomAnimation: true, zoomAnimationThreshold: 6, fadeAnimation: true
            });

            extendZoomAnimation(map);
            drawBasemap();

            map.setView([62.0, -6.8], 6);

            startWeatherCanvas();

            function refreshMapSize() { try { map.invalidateSize(false); } catch (e) {} wxResize(); }
            setTimeout(refreshMapSize, 400);
            setTimeout(refreshMapSize, 1500);
            if (window.addEventListener) { window.addEventListener('load', refreshMapSize, false); }

            if (window.location && window.location.hash === '#lanes') {
                showErrBar(JSON.stringify(norronaLanes()));
            }

            loadCachedSchedule();
            fetchSchedule();
            setInterval(fetchSchedule, SCHEDULE_PULL_MS);

            var cachedSea = loadCachedSea();
            if (cachedSea) {
                seaState = cachedSea;
                renderSeaState();
            }

            var loadedCache = loadCachedData();
            if (loadedCache) {
                displayCachedData(loadedCache);
                if (loadedCache.destLatLng) fetchWeather(loadedCache.destLatLng[0], loadedCache.destLatLng[1]);
                else if (loadedCache.currentLatLng) fetchWeather(loadedCache.currentLatLng[0], loadedCache.currentLatLng[1]);
            }

            updateShipData();
            setInterval(updateShipData, 120000);
            scheduleViewCycle();
            startLaneSync();
        }
        startMap();
